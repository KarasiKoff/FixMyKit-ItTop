global:
  scrape_interval: 15s
  evaluation_interval: 30s
  external_labels:
    cluster: "fixmykit"
    environment: "local"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090

  - job_name: fmk-backend
    metrics_path: /metrics
    static_configs:
      - targets:
          - __BACKEND_METRICS_TARGET__
        labels:
          service: backend
          component: api

  - job_name: fmk-db
    static_configs:
      - targets:
          - postgres-exporter:9187
        labels:
          service: database
          component: postgres

  - job_name: fmk-cadvisor
    static_configs:
      - targets:
          - cadvisor:8080
        labels:
          service: infrastructure
          component: cadvisor
