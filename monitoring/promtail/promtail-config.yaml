# Читает JSON-логи бэкенда из /var/log/fixmykit (монтируется с хоста или volume prod).

server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: fixmykit-backend-files
    static_configs:
      - targets:
          - localhost
        labels:
          job: fixmykit
          service: backend
          __path__: /var/log/fixmykit/fixmykit*.log
    pipeline_stages:
      - json:
          expressions:
            level: level
            message: message
            logger: logger
            request_id: request_id
      - labels:
          level:
          logger:
