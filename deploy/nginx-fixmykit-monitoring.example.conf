# Grafana на поддомене (production).
# Скопируйте в sites-available, подставьте домен и пути к сертификатам.
#
#   sudo htpasswd -c /etc/nginx/.htpasswd-fixmykit-grafana admin
#   sudo ln -s /etc/nginx/sites-available/fixmykit-monitoring /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# В .env.monitoring:
#   GRAFANA_ROOT_URL=https://grafana.fixmykit.example.com
#   GRAFANA_PORT=127.0.0.1:3000:3000

# Редirect HTTP → HTTPS
server {
    listen 80;
    server_name grafana.fixmykit.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name grafana.fixmykit.example.com;

    ssl_certificate     /etc/letsencrypt/live/grafana.fixmykit.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/grafana.fixmykit.example.com/privkey.pem;

    # Дополнительный слой перед логином Grafana (пароль Grafana — отдельно)
    auth_basic "Fix My Kit Monitoring";
    auth_basic_user_file /etc/nginx/.htpasswd-fixmykit-grafana;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Grafana Live / websockets
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
