# docker compose --env-file .env up -d
# Сеть fixmykit-dev — для overlay мониторинга (docker-compose.monitoring.local.yml)
name: fixmykit-dev

x-env: &env
  env_file:
    - ${ENV_FILE:-.env}

services:
  postgres:
    <<: [*env]
    image: postgres:18.1-alpine
    container_name: fixmykit-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fixmykit}
      POSTGRES_USER: ${POSTGRES_USER:-fixmykit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fixmykit}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fixmykit} -d ${POSTGRES_DB:-fixmykit}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - fixmykit_dev

  redis:
    image: redis:8.2.1-alpine
    container_name: fixmykit-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - fixmykit_dev

  backend:
    <<: [*env]
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
    container_name: fixmykit-backend
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      REDIS_URL: redis://redis:6379/0
      REALTIME_BACKEND: redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./data/uploads:/app/data/uploads
      - ./data/logs:/app/data/logs
    networks:
      - fixmykit_dev

  frontend:
    <<: [*env]
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend
      args:
        VITE_PROXY_TARGET: ${VITE_PROXY_TARGET:-http://backend:8000}
    container_name: fixmykit-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    environment:
      VITE_PROXY_TARGET: ${VITE_PROXY_TARGET:-http://backend:8000}
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    networks:
      - fixmykit_dev

volumes:
  postgres_data:

networks:
  fixmykit_dev:
    name: fixmykit-dev
    driver: bridge
