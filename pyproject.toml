[project]
name = "fix-my-kit"
version = "0.1.0"
description = "Fix My Kit backend API"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.18.4",
    "bcrypt>=5.0",
    "fastapi>=0.136.3,<0.137",
    "prometheus-fastapi-instrumentator>=8.0.0",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.13.4",
    "pyjwt>=2.12.1",
    "python-multipart>=0.0.27",
    "redis>=7.1.0",
    "sqlalchemy>=2.0.49",
    "uvicorn[standard]>=0.46.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
    "ruff>=0.15.16",
    "pre-commit>=4.6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: требует PostgreSQL (API-тесты)",
    "tracker_http: FakeTrackerClient и реальный try_tracker_sync / sync endpoint",
]

[tool.ruff]
target-version = "py314"

[tool.uv]
package = false
