[project]
name = "fix-my-kit"
version = "0.1.0"
description = "Fix My Kit backend API"
requires-python = ">=3.14"
dependencies = [
    "alembic",
    "bcrypt",
    "fastapi",
    "prometheus-fastapi-instrumentator>=8.0.0",
    "psycopg[binary]",
    "pydantic-settings",
    "pyjwt",
    "python-multipart",
    "sqlalchemy",
    "uvicorn[standard]",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
    "ruff>=0.15.16",
    "pre-commit>=4.6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: требует PostgreSQL (API-тесты)",
    "tracker_http: FakeTrackerClient и реальный try_tracker_sync / sync endpoint",
]

[tool.ruff]
target-version = "py314"

[tool.uv]
package = false
