[project]
name = "fix-my-kit"
version = "0.1.0"
description = "Fix My Kit backend API"
requires-python = ">=3.14"
dependencies = [
    "alembic",
    "bcrypt",
    "fastapi",
    "psycopg[binary]",
    "pydantic-settings",
    "pyjwt",
    "python-multipart",
    "sqlalchemy",
    "uvicorn[standard]",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: требует PostgreSQL (API-тесты)",
    "tracker_http: FakeTrackerClient и реальный try_tracker_sync / sync endpoint",
]

[tool.uv]
package = false
